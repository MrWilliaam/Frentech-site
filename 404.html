<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Frentech</title>
  <link rel="shortcut icon" href="assets/images/fren1.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #0d0d12;
      --off: #f5f4f0;
      --accent: #e8ff47;
      --mid: #8a8a8a;
      --font-display: 'Syne', sans-serif;
      --font-body: 'DM Sans', sans-serif;
    }

    body {
      font-family: var(--font-body);
      background: var(--ink);
      color: var(--off);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* NAV */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 40px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }

    nav img { height: 32px; filter: invert(1); }

    nav a.back-link {
      font-family: var(--font-display);
      font-size: 0.85rem;
      font-weight: 600;
      color: rgba(255,255,255,0.5);
      text-decoration: none;
      letter-spacing: 0.04em;
      transition: color 0.2s;
    }

    nav a.back-link:hover { color: var(--accent); }

    /* MAIN */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 24px;
    }

    .error-num {
      font-family: var(--font-display);
      font-size: clamp(8rem, 22vw, 18rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.05em;
      color: transparent;
      -webkit-text-stroke: 2px rgba(255,255,255,0.12);
      user-select: none;
      margin-bottom: -20px;
    }

    .error-badge {
      display: inline-block;
      background: var(--accent);
      color: var(--ink);
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 8px 20px;
      border-radius: 100px;
      margin-bottom: 28px;
    }

    h1 {
      font-family: var(--font-display);
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 16px;
    }

    p {
      font-size: 1rem;
      color: rgba(255,255,255,0.45);
      line-height: 1.7;
      max-width: 400px;
      margin-bottom: 44px;
    }

    .btn {
      background: var(--accent);
      color: var(--ink);
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 0.02em;
      padding: 16px 36px;
      border-radius: 100px;
      text-decoration: none;
      border: 2px solid var(--accent);
      transition: background 0.2s, color 0.2s, transform 0.2s;
      display: inline-block;
    }

    .btn:hover {
      background: transparent;
      color: var(--accent);
      transform: translateY(-2px);
    }

    /* FOOTER */
    footer {
      padding: 24px 40px;
      border-top: 1px solid rgba(255,255,255,0.06);
      text-align: center;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.2);
    }

    @media (max-width: 600px) {
      nav { padding: 16px 20px; }
      footer { padding: 20px; }
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html">
    <img src="assets/images/frenlogo2_converted.svg" alt="Frentech" />
  </a>
  <a href="index.html" class="back-link">← Zpět na hlavní stránku</a>
</nav>

<main>
  <div class="error-num">404</div>
  <div class="error-badge">Stránka nenalezena</div>
  <h1>Tuhle stránku<br>jsme nenašli</h1>
  <p>Stránka, kterou hledáte, neexistuje nebo byla přesunuta. Zkuste to znovu z hlavní stránky.</p>
  <a href="index.html" class="btn">Zpět domů →</a>
</main>

<footer>
  © 2026 Frentech — Všechna práva vyhrazena
</footer>

</body>
</html>
